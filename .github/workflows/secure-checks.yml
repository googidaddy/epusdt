name: secure-checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: src/go.sum
      - name: Verify all Go packages and critical concurrency boundaries
        working-directory: src
        run: |
          go vet ./...
          # Upstream Aptos ledger test is time-dependent and intermittently fails,
          # more often under -race (reproduced 2/3 on the unmodified baseline
          # aed4a97, so it is not a regression of this fork). Aptos is not part of
          # this deployment profile. Skip it by name; never drop the race step.
          SKIP='^TestProcessAptosLedgerRoundMarksMatchingUSDTOrderPaid$'
          go test -count=1 -skip "$SKIP" ./...
          go test -race -count=1 -skip "$SKIP" ./internal/securegateway ./task ./model/service ./model/data
      - name: Check reachable vulnerabilities in the secure entry point
        working-directory: src
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/secure
      - name: Install encryption and ingress tooling on the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age nginx openssl
          command -v age
          command -v age-keygen
      - name: Verify encrypted backups and isolated Nginx ingress
        env:
          EPUSDT_TEST_NGINX: '1'
        run: python3 -B -m unittest discover -s ops/secure -p 'test_*.py'
      - name: Build only the secure image without publishing
        env:
          SECURE_REVISION: ${{ github.sha }}
        run: |
          docker build --file ops/secure/Dockerfile --build-arg "SOURCE_REVISION=$SECURE_REVISION" --tag "epusdt-secure-check:$SECURE_REVISION" .
      - name: Verify the image refuses to start without private configuration
        env:
          SECURE_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          result = subprocess.run([
              'docker', 'run', '--rm', '--pull', 'never', '--network', 'none',
              '--read-only', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges:true',
              'epusdt-secure-check:' + os.environ['SECURE_REVISION'],
          ], capture_output=True, text=True, timeout=20)
          if result.returncode != 1 or 'private configuration unavailable' not in result.stderr:
              raise SystemExit('Secure image did not reject missing private configuration as expected')
          print('Secure image startup fails closed without private configuration.')
          PY
